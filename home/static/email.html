<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutors: Create an Account</title>
<link rel="stylesheet" href="/static/home.css">
</head>
<body class="aerial">
<form class="card" id="emailform">
  <h1 id="title">Create an Account</h1>
  <p>Type your email. We will send you a link.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.edu" required>
  <button class="primary" type="submit">Email me a link</button>
  <div class="msg" id="msg"></div>
  <a class="link" id="back" href="/">Return to Login</a>
</form>
<script src="/static/home.js"></script>
<script>
const kind = params.get('kind') === 'forgot' ? 'forgot' : 'create';
if (kind === 'forgot') {
  $('title').textContent = 'Forgot username or passcode';
  document.title = 'Tutors: Forgot username or passcode';
}
$('back').href = withNext('/');
onSubmit('emailform', 'msg', async () => {
  const r = await api('/api/email', {email: $('email').value.trim(), kind, next});
  showOk('msg', r.message);
});
$('email').focus();
</script>
</body>
</html>
