<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutors: Sign in</title>
<link rel="stylesheet" href="/static/home.css">
</head>
<body class="aerial">
<form class="card" id="signin">
  <h1>Sign in</h1>
  <p>One username and passcode for every tutor.</p>
  <label for="username">Username</label>
  <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="code">4-digit passcode</label>
  <input id="code" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
         autocomplete="current-password" required>
  <button class="primary" type="submit">Sign in</button>
  <div class="msg" id="msg"></div>
  <a class="link" id="forgot" href="/email?kind=forgot">Forgot username or passcode?</a>
  <div class="new">New to Tutors?<button type="button" id="create">Create an Account</button></div>
</form>
<script src="/static/home.js"></script>
<script>
$('forgot').href = withNext('/email?kind=forgot');
$('create').addEventListener('click', () => { location = withNext('/email?kind=create'); });
onSubmit('signin', 'msg', async () => {
  const r = await api('/api/signin', {username: $('username').value.trim(), code: $('code').value.trim(), next});
  location = r.go;
});
$('username').focus();
</script>
</body>
</html>
