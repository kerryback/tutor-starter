# The binomial tutor: names shown to students, the prompt's reference files,
# and where it is deployed.

name = "binomial"
title = "Binomial Tutor"
subtitle = "Binomial option pricing"

# Words Whisper should expect, so it spells them right.
whisper_prompt = "Binomial option pricing: call, put, strike, delta, risk-neutral probability q, up factor u, down factor d, bond, replicating portfolio, American, European, early exercise."

# Teaching scripts and the problem bank, in the order they go into the prompt
# after content/topic.md.
references = ["01-replication.md", "02-risk-neutral.md", "03-multiperiod.md",
              "04-american.md", "exercises.md"]

[deploy]
app = "binomial-voice"
service = "web"
volume = "binomial-voice-data"
instance = "medium"
region = "fra"
